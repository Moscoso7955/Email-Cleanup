<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <title>Correspondence Filer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header>
    <h1>Correspondence Filer</h1>
    {% if signed_in %}
      <a href="{{ url_for('oauth_logout') }}">Sign out</a>
    {% endif %}
  </header>
  <main>
    {% if not signed_in %}
      <p>Sign in with Google to file Gmail threads to Drive.</p>
      <p><a class="btn" href="{{ url_for('oauth_login') }}">Sign in with Google</a></p>
    {% else %}
      <form id="filing-form">
        <div class="field">
          <span>Saved entity</span>
          <div class="picker-row">
            <select id="entity-select">
              <option value="">— pick saved entity (optional) —</option>
            </select>
            <button type="button" id="delete-entity-btn" class="link-btn" hidden>Delete</button>
          </div>
        </div>

        <label class="field">
          <span>Gmail label</span>
          <select id="label-select" required>
            <option value="">Loading labels…</option>
          </select>
        </label>

        <div class="field">
          <span>Target Drive folder</span>
          <div class="picker-row">
            <button type="button" id="pick-folder-btn" class="btn">Choose folder…</button>
            <span id="folder-name" class="folder-name">No folder selected</span>
          </div>
          <input type="hidden" id="folder-id">
        </div>

                <div class="field">
          <span>Date Range</span>
          <div class="drp-wrap" id="drp-container">
            <input type="hidden" id="after-input">
            <input type="hidden" id="before-input">
          </div>
        </div>

        <label class="checkbox">
          <input type="checkbox" id="dry-run-input">
          <span>Dry run (plan without uploading)</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="reupload-input">
          <span>Reupload already-filed threads</span>
        </label>

        <p class="actions">
          <button type="submit" id="start-btn" class="btn">Start</button>
          <button type="button" id="save-entity-btn" class="btn btn-secondary">Save as entity…</button>
        </p>
      </form>

      <section id="progress-section" hidden>
        <h2>Progress</h2>
        <div id="summary" class="summary"></div>
        <ul id="log" class="log"></ul>
      </section>

      <script src="https://apis.google.com/js/api.js"></script>
              <script src="{{ url_for('static', filename='date-picker.js') }}"></script>
        <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% endif %}
  </main>
</body>
</html>
